[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-mirror"
version = "0.1.0"
description = "arXiv metadata resolution and on-request PDF storage service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiohttp>=3.11.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "lxml>=5.3.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff==0.16.2",
]

[project.scripts]
arxiv-mirror-api = "arxiv_mirror.main:run_api"
arxiv-mirror-harvest = "arxiv_mirror.main:run_harvest"

[tool.setuptools.packages.find]
include = ["arxiv_mirror*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
